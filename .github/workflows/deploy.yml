# Демо-сайт на GitHub Pages: собирается и выкладывается после каждого push в main.
# Включение: Settings → Pages → Build and deployment → Source: GitHub Actions.
# Формы на демо не отправляются (на Pages нет сервера) — показывают телефоны и мессенджеры.
# Боевой сайт сюда не относится — по 152-ФЗ он размещается на хостинге в РФ.
name: Deploy demo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - id: pages
        uses: actions/configure-pages@v5

      - run: npm ci

      - run: npm run build
        env:
          # https://ник.github.io и /имя-репозитория — сайт собирается в подпапку
          SITE: ${{ steps.pages.outputs.origin }}
          BASE: ${{ steps.pages.outputs.base_path }}
          # демо закрыто от поисковиков
          PUBLIC_NOINDEX: 'true'

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
