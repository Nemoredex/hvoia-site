# nginx для www.hvoia-event.ru — VPS в РФ (152-ФЗ).
# Путь к сайту: /var/www/hvoia (сюда кладётся весь проект после npm ci && npm run build).
# Статика — dist/client, POST /api/lead/ — Node-процесс (deploy/hvoia-api.service) на 127.0.0.1:4321.
# Сертификаты — Let's Encrypt (certbot). Проверка: nginx -t && systemctl reload nginx.

# Карта 301 со старого сайта (генерирует scripts/redirects.mjs).
include /var/www/hvoia/deploy/nginx-redirects.conf;

# Главное зеркало: всё на https://www.hvoia-event.ru (так уже настроено на старом сайте).
server {
    listen 80;
    listen [::]:80;
    server_name hvoia-event.ru www.hvoia-event.ru;
    return 301 https://www.hvoia-event.ru$request_uri;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name hvoia-event.ru;
    ssl_certificate     /etc/letsencrypt/live/www.hvoia-event.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.hvoia-event.ru/privkey.pem;
    return 301 https://www.hvoia-event.ru$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.hvoia-event.ru;
    ssl_certificate     /etc/letsencrypt/live/www.hvoia-event.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.hvoia-event.ru/privkey.pem;

    root /var/www/hvoia/dist/client;
    index index.html;
    charset utf-8;

    # --- Безопасность (заголовки — в nginx-headers.conf, подключается в каждом location) ---
    include /var/www/hvoia/deploy/nginx-headers.conf;
    client_max_body_size 64k;

    # --- Сжатие ---
    # npm run build кладёт рядом с HTML/CSS/JS/SVG готовые .gz (gzip 9) и .br (brotli 11):
    # nginx отдаёт их без сжатия на лету. gzip on — запасной вариант для файлов без .gz.
    # brotli_static/brotli — если установлен модуль ngx_brotli: раскомментировать.
    gzip_static on;
    # brotli_static on;
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml application/manifest+json;
    # brotli on; brotli_comp_level 5; brotli_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

    # --- 301 со старого сайта ---
    if ($hvoia_redirect) {
        return 301 $hvoia_redirect;
    }

    # --- Слэш на конце: /kottedzh → /kottedzh/ (файлы с расширением не трогаем) ---
    location ~ ^([^.?]*[^/])$ {
        if (-d $document_root$1) {
            return 301 $1/$is_args$args;
        }
        try_files $uri =404;
    }

    # --- Страницы: HTML не кешируем надолго, чтобы правки сразу были видны ---
    location / {
        try_files $uri $uri/index.html =404;
        add_header Cache-Control "public, max-age=300" always;
        include /var/www/hvoia/deploy/nginx-headers.conf;
    }

    # --- Файлы сборки с хешем в имени — кеш на год ---
    location ^~ /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /var/www/hvoia/deploy/nginx-headers.conf;
        try_files $uri =404;
    }

    # --- Заявки ---
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:4321;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 20s;
    }

    # Настоящий код 404 со страницей сайта (Яндекс не должен видеть 200 на несуществующих адресах).
    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header Cache-Control "no-cache" always;
        include /var/www/hvoia/deploy/nginx-headers.conf;
    }

    # Служебное не отдаём.
    location ~ /\.(?!well-known) { deny all; }
}
